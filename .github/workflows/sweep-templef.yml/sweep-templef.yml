# Temple-F (IMP-VISION glasses temple board) sweep — parallel sandbox
# matrix on GitHub Actions.
#
# Purpose: run the Temple-F now-tier families (tfa/tfb/tfc/tfd) against
# router variants in parallel, each in its own job, and report DRC numbers
# live to the `sweep-results` branch (namespaced results/templef/) so a
# watcher can update the Four Windows Space while the sweep is still
# running.
#
# Reference board: Temple-F routed final, 50 unconnected / 0 shorts /
# 2 clearance (the 2 are ONE fenced geometry: J3 south MP tab 0.05 mm
# from U13 pads 15/16, both anchors, pad-to-pad). Finish line is
# DRC-clean 0/0/0; no now-tier job can reach it (clearance floor 2 +
# V3_3 U13.4 fenced). A family "beats" the reference only with
# <50 unconnected at 0 shorts / <=2 clearance. No fab, no orders,
# no gate PASS.
#
# Gated respin families (tfr1-tfr4: J3/U13/U2 respin) are QUEUED —
# Trevor's respin scope call is still open. They are accepted as
# workflow inputs but report status "queued" and burn no router time.
#
# Triggers:
#   - workflow_dispatch: full now-tier matrix (families x variants).
#     Inputs let the dispatcher narrow the matrix.
#   - schedule every 4h ('0 */4 * * *'): same matrix as dispatch.
#   - push to this file: toolchain smoke job ONLY (proves install + DRC +
#     live-results commit). The matrix never runs on push.
#
# Free-tier safety: public repo, ubuntu-24.04 runners, no paid actions,
# no secrets. Max-parallel: 4 families x 6 variants = 24 jobs at once
# (public-repo concurrency is 20, so the last 4 queue behind the first 20).
# No cap, no serialization. Toolchain installs are cached between runs
# (apt archives + Freerouting jar). Fail-fast lives per job (placement gate
# + stage gate), never at the matrix level. Each sweep job is capped at
# 90 min so a hung router cannot burn the run.
#
# ADDING THIS FILE: the Muse GitHub App cannot create/edit anything under
# .github/workflows/ (403, lacks Workflows permission). Add this file
# through the GitHub web UI (see four-windows-templef-spec.md for the
# exact steps). Do not claim the workflow is live until it is verifiably
# in the repo.

name: Temple-F sweep

on:
  workflow_dispatch:
    inputs:
      families:
        description: 'Families to run, comma-separated, most promising first (tfr1-tfr4 report queued until Trevor rules the respin scope)'
        required: false
        default: 'tfa,tfb,tfc,tfd'
      variants:
        description: 'Router variants, comma-separated, most promising first'
        required: false
        default: 'astar-0.1,astar-0.05,astar-0.02,freerouting-mp3,freerouting-mp10,gated-pairs'
  schedule:
    - cron: '0 */4 * * *'
  push:
    paths:
      - '.github/workflows/sweep-templef.yml'

permissions:
  contents: write

env:
  KICAD_VERSION_WANT: '7.0'
  FREEROUTING_VERSION: '1.9.0'
  FREEROUTING_JAR_URL: 'https://github.com/freerouting/freerouting/releases/download/v1.9.0/freerouting-1.9.0.jar'
  FREEROUTING_JAR_SIZE: '5044336'
  TEMPLEF_UNCONNECTED: '50'
  TEMPLEF_SHORTS: '0'
  TEMPLEF_CLEARANCE: '2'

jobs:
  setup:
    name: Build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      family_count: ${{ steps.build.outputs.family_count }}
      variant_count: ${{ steps.build.outputs.variant_count }}
    steps:
      - id: build
        run: |
          python3 - <<'PY'
          import json, os
          fams = [f.strip() for f in os.environ.get('FAMILIES', 'tfa,tfb,tfc,tfd').split(',') if f.strip()]
          vars_ = [v.strip() for v in os.environ.get('VARIANTS', 'astar-0.1,astar-0.05,astar-0.02,freerouting-mp3,freerouting-mp10,gated-pairs').split(',') if v.strip()]
          combos = [{'family': f, 'variant': v} for f in fams for v in vars_]
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as fh:
              fh.write('matrix=' + json.dumps({'include': combos}) + '\n')
              fh.write('family_count=%d\n' % len(fams))
              fh.write('variant_count=%d\n' % len(vars_))
          print('matrix: %d jobs (%d families x %d variants)' % (len(combos), len(fams), len(vars_)))
          PY
        env:
          FAMILIES: ${{ inputs.families || 'tfa,tfb,tfc,tfd' }}
          VARIANTS: ${{ inputs.variants || 'astar-0.1,astar-0.05,astar-0.02,freerouting-mp3,freerouting-mp10,gated-pairs' }}

  toolchain:
    name: Toolchain smoke (Temple-F DRC + live results)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore apt cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: apt-kicad7-java21-${{ runner.os }}-v1
      - name: Install KiCad 7 + Java 21 + Xvfb
        run: |
          set -e
          mkdir -p "$HOME/.cache/apt-archives"
          sudo apt-get update -qq
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/apt-archives" install -y -qq kicad xvfb openjdk-21-jre curl jq > /tmp/apt.log 2>&1
          kicad-cli version
          java -version 2>&1 | head -1
          # Locate pcbnew and export it for later steps
          python3 - <<'PY'
          import os, subprocess, sys
          cands = ['/usr/lib/kicad/lib/python3/dist-packages',
                   '/usr/lib/python3/dist-packages',
                   '/usr/lib/kicad/python3/dist-packages']
          found = None
          for d in cands:
              if os.path.exists(os.path.join(d, 'pcbnew.py')):
                  found = d
                  break
          if found is None:
              print('pcbnew.py not found in', cands)
              sys.exit(1)
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write('PYTHONPATH=%s:%s\n' % (found, os.environ.get('PYTHONPATH', '')))
          print('pcbnew at', found)
          PY
          python3 -c "import pcbnew; print('pcbnew OK', pcbnew.Version())"
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
          xdpyinfo -display :99 > /dev/null 2>&1 || (echo 'Xvfb did not come up'; cat /tmp/xvfb.log; exit 1)
          echo 'Xvfb up on :99'
      - name: DRC the Temple-F reference board
        run: |
          set -e
          mkdir -p out
          cp hardware/pcb/temple-f/templef_tfa.kicad_pcb hardware/pcb/temple-f/templef_tfa.kicad_pro out/
          xvfb-run -a python3 tools/sweep-templef/drc.py out/templef_tfa.kicad_pcb out/templef_drc.txt
          python3 tools/sweep-templef/parse_drc.py out/templef_drc.txt out/templef_counts.json
          cat out/templef_counts.json
      - name: Write + push live results
        run: |
          set -e
          python3 tools/sweep-templef/write_results.py \
            --family toolchain --variant templef-baseline \
            --run-number "${{ github.run_number }}" --run-id "${{ github.run_id }}" \
            --counts out/templef_counts.json --board out/templef_tfa.kicad_pcb \
            --status toolchain-ok --reason 'Temple-F baseline DRC reproduced on runner' \
            --out out/toolchain-templef-baseline.json
          bash tools/sweep-templef/push-results.sh out/toolchain-templef-baseline.json "${{ github.run_number }}" toolchain templef-baseline
      - name: Job summary
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open('out/templef_counts.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('## Toolchain smoke — Temple-F baseline\n\n')
              fh.write('| unconnected | shorts | clearance | total violations |\n|---:|---:|---:|---:|\n')
              fh.write('| %d | %d | %d | %d |\n' % (c['unconnected'], c['shorts'], c['clearance'], c['total']))
              fh.write('\nExpected: 50 / 0 / 2 (2 clearance = the fenced J3/U13 pair). Live result committed to `sweep-results` as `results/templef/%s/toolchain-templef-baseline.json`.\n' % '${{ github.run_number }}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-templef-baseline
          path: |
            out/templef_drc.txt
            out/templef_counts.json
            out/toolchain-templef-baseline.json
          retention-days: 30

  sweep:
    name: Sweep ${{ matrix.family }} / ${{ matrix.variant }}
    needs: setup
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore toolchain cache (apt + Freerouting jar)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt-archives
            tools/freerouting
          key: sweep-toolchain-${{ runner.os }}-fr1.9.0-v1
      - name: Install KiCad 7 + Java 21 + Xvfb + Freerouting
        run: |
          set -e
          mkdir -p "$HOME/.cache/apt-archives"
          sudo apt-get update -qq
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/apt-archives" install -y -qq kicad xvfb openjdk-21-jre curl jq > /tmp/apt.log 2>&1
          kicad-cli version
          python3 - <<'PY'
          import os, sys
          cands = ['/usr/lib/kicad/lib/python3/dist-packages',
                   '/usr/lib/python3/dist-packages',
                   '/usr/lib/kicad/python3/dist-packages']
          found = None
          for d in cands:
              if os.path.exists(os.path.join(d, 'pcbnew.py')):
                  found = d
                  break
          if found is None:
              print('pcbnew.py not found in', cands)
              sys.exit(1)
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write('PYTHONPATH=%s:%s\n' % (found, os.environ.get('PYTHONPATH', '')))
          print('pcbnew at', found)
          PY
          python3 -c "import pcbnew; print('pcbnew OK', pcbnew.Version())"
          mkdir -p tools/freerouting
          if [ ! -f tools/freerouting/freerouting.jar ] || [ "$(stat -c%s tools/freerouting/freerouting.jar)" != "$FREEROUTING_JAR_SIZE" ]; then
            curl -sL -o tools/freerouting/freerouting.jar "$FREEROUTING_JAR_URL"
            test "$(stat -c%s tools/freerouting/freerouting.jar)" = "$FREEROUTING_JAR_SIZE"
          fi
          echo 'Freerouting 1.9.0 jar present and size-verified (cache or fresh download)'
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
          xdpyinfo -display :99 > /dev/null 2>&1 || (echo 'Xvfb did not come up'; cat /tmp/xvfb.log; exit 1)
      - name: Run family variant
        run: |
          bash tools/sweep-templef/run_variant.sh "${{ matrix.family }}" "${{ matrix.variant }}" "${{ github.run_number }}" "${{ github.run_id }}"
      - name: Push live results
        if: always()
        run: |
          f="out/${{ matrix.family }}-${{ matrix.variant }}.json"
          test -f "$f" || { echo "no results JSON at $f"; exit 1; }
          bash tools/sweep-templef/push-results.sh "$f" "${{ github.run_number }}" "${{ matrix.family }}" "${{ matrix.variant }}"
      - name: Job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = 'out/${{ matrix.family }}-${{ matrix.variant }}.json'
          try:
              r = json.load(open(p))
          except Exception as e:
              print('no results JSON:', e)
              raise SystemExit(0)
          d = r.get('drc') or {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('## %s / %s — %s\n\n' % (r['family'], r['variant'], r['status']))
              fh.write('Reason: %s\n\n' % r.get('reason', ''))
              fh.write('| unconnected | shorts | clearance | verdict vs Temple-F | DRC-clean |\n|---:|---:|---:|---|---:|\n')
              fh.write('| %s | %s | %s | %s | %s |\n' % (d.get('unconnected', '-'), d.get('shorts', '-'), d.get('clearance', '-'), r.get('verdict_vs_templef', 'n/a'), r.get('drc_clean', False)))
              fh.write('\nLive result: `results/templef/%s/%s-%s.json` on branch `sweep-results`.\n' % ('${{ github.run_number }}', r['family'], r['variant']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-templef-${{ matrix.family }}-${{ matrix.variant }}
          path: |
            out/
          retention-days: 30

  aggregate:
    name: Aggregate live summary
    needs: [setup, sweep]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-templef-*
          path: artifacts
          merge-multiple: true
      - name: Merge summary + push
        run: |
          set -e
          python3 - <<'PY'
          import glob, json, os
          files = sorted(glob.glob('artifacts/*-*.json'))
          # only per-job result JSONs (schema templef-sweep-result/1), not counts
          jobs = []
          for f in files:
              try:
                  r = json.load(open(f))
              except Exception:
                  continue
              if r.get('schema') == 'templef-sweep-result/1':
                  jobs.append(r)
          jobs.sort(key=lambda r: (r['family'], r['variant']))
          summary = {
              'schema': 'templef-sweep-summary/1',
              'run_number': int(os.environ.get('RUN_NUMBER', '0')),
              'run_id': os.environ.get('RUN_ID', ''),
              'templef_reference': {'unconnected': 50, 'shorts': 0, 'clearance': 2},
              'jobs': jobs,
              'beat_templef': [j['family'] + '/' + j['variant'] for j in jobs if j.get('verdict_vs_templef') == 'beat'],
              'drc_clean': [j['family'] + '/' + j['variant'] for j in jobs if j.get('drc_clean')],
              'queued': [j['family'] + '/' + j['variant'] for j in jobs if j.get('status') == 'queued'],
          }
          os.makedirs('summary-out', exist_ok=True)
          with open('summary-out/summary.json', 'w') as fh:
              json.dump(summary, fh, indent=2)
          print('aggregated %d jobs; beat Temple-F: %s; DRC-clean: %s; queued: %s'
                % (len(jobs), summary['beat_templef'], summary['drc_clean'], summary['queued']))
          PY
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
      - name: Push summary to sweep-results
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin sweep-results 2>/dev/null || true
          rm -rf /tmp/sweep-results-wt-templef
          if git rev-parse --verify origin/sweep-results >/dev/null 2>&1; then
            git worktree add /tmp/sweep-results-wt-templef sweep-results
          else
            git worktree add --detach /tmp/sweep-results-wt-templef
            git -C /tmp/sweep-results-wt-templef checkout --orphan sweep-results
            git -C /tmp/sweep-results-wt-templef rm -rf . 2>/dev/null || true
          fi
          mkdir -p "/tmp/sweep-results-wt-templef/results/templef/${{ github.run_number }}/history"
          cp summary-out/summary.json "/tmp/sweep-results-wt-templef/results/templef/summary.json"
          cp summary-out/summary.json "/tmp/sweep-results-wt-templef/results/templef/history/${{ github.run_number }}-summary.json"
          cd /tmp/sweep-results-wt-templef
          git add results/templef/summary.json "results/templef/history/${{ github.run_number }}-summary.json"
          git commit -m "templef sweep summary run ${{ github.run_number }}" || echo 'nothing to commit'
          git push origin sweep-results || (git pull --rebase origin sweep-results && git push origin sweep-results)
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/sweep-results-wt-templef
